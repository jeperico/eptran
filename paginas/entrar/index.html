<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrar - EPTRAN</title>

        <!-- JQuery -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        />

        <!-- Styles -->
        <link rel="stylesheet" href="/assets/styles/main.css" />
    </head>

    <body>
        <header>
            <div class="container">
                <button class="nav-btn icon-btn none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <img
                    src="/assets/images/logos/logo-eptran-white.png"
                    alt=""
                    class="logo"
                />
                <a class="account-btn icon-btn">
                    <i class="fa-solid fa-circle-user"></i>
                </a>
            </div>

            <div class="modal hide">
                <div class="bg"></div>

                <div class="sidebar hide">
                    <div class="logos">
                        <img
                            src="/assets/images/logos/logo-eptran-white.png"
                            alt="EPTRAN"
                        />
                        <hr />
                        <img
                            src="/assets/images/logos/logo-joinville-white.png"
                            alt="Prefeitura de Joinville"
                        />
                    </div>
                    <hr />
                    <ul>
                        <li>
                            <a href="/paginas/inicio"
                                ><i class="fa-solid fa-house"></i> Página
                                Inicial</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/jogos"
                                ><i class="fa-solid fa-gamepad"></i> Jogos</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/postagens"
                                ><i class="fa-solid fa-book-open"></i>
                                Postagens</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/sobre-nos"
                                ><i class="fa-solid fa-circle-info"></i> Sobre
                                Nós</a
                            >
                        </li>
                    </ul>
                </div>

                <div class="globe hide">
                    <!-- <div class="wrapper"> -->
                    <img
                        class="world"
                        src="/assets/images/world.png"
                        alt="Mundo Bacana"
                    />
                    <img
                        class="seal"
                        src="/assets/images/seal-german-lg.png"
                        alt="Foca de Foca no Trânsito"
                    />
                    <!-- </div> -->
                </div>
            </div>
        </header>
        <div class="header-box"></div>

        <main>
            <section>
                <div class="container page-form">
                    <form>
                        <span class="title">Entrar</span>
                        <div class="form-section active">
                            <div class="input">
                                <label>E-mail: </label>
                                <input type="email" name="email" />
                            </div>
                            <div class="input">
                                <label>Senha: </label>
                                <input
                                    type="password"
                                    name="password"
                                    minlength="8"
                                    maxlength="31"
                                />
                                <button type="button" class="turn hide none">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="finish">
                            <a href="/paginas/cadastrar"
                                >Não possuo uma conta</a
                            >
                            <div class="btns">
                                <button type="submit">Enviar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div class="container">
                <div class="logos">
                    <img
                        src="/assets/images/logos/logo-eptran-white.png"
                        alt="EPTRAN"
                    />
                    <hr />
                    <img
                        src="/assets/images/logos/logo-joinville-white.png"
                        alt="Prefeitura de Joinville"
                    />
                </div>
                <div class="adress">
                    <h3>Informações de Contato</h3>
                    <hr />
                    <ul>
                        <li>
                            R. Caçador, 112 - Atiradores, Joinville - SC,
                            89203-610
                        </li>
                        <li>(47) 99121-0089</li>
                        <li>detrans.uet@joinville.sc.gov.br</li>
                    </ul>
                </div>
                <div class="social-medias">
                    <h3>Redes Sociais</h3>
                    <hr />
                    <ul>
                        <li>
                            <i class="fa-brands fa-youtube"></i>
                            <a href="">YouTube</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-square-facebook"></i>
                            <a href=""> Facebook</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-instagram"></i>
                            <a href="">Instagram</a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>

        <!-- Custom Scripts -->
        <script src="/assets/scripts/sidebar.js"></script>
        <script src="/assets/scripts/form.js"></script>
    </body>
</html>
