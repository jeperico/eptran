<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EPTRAN</title>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        />

        <!-- Swiper JS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
        />
        <link rel="stylesheet" href="/assets/styles/swiper.css" />

        <!-- Styles -->
        <link rel="stylesheet" href="/assets/styles/main.css" />
    </head>

    <body>
        <header>
            <div class="container">
                <button class="nav-btn icon-btn none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <img
                    src="/assets/images/logos/logo-eptran-white.png"
                    alt=""
                    class="logo"
                />
                <a href="/paginas/perfil" class="account-btn icon-btn">
                    <i class="fa-solid fa-circle-user"></i>
                </a>
            </div>

            <div class="modal hide">
                <div class="bg"></div>

                <div class="sidebar hide">
                    <div class="logos">
                        <img
                            src="/assets/images/logos/logo-eptran-white.png"
                            alt="EPTRAN"
                        />
                        <hr />
                        <img
                            src="/assets/images/logos/logo-joinville-white.png"
                            alt="Prefeitura de Joinville"
                        />
                    </div>
                    <hr />
                    <ul>
                        <li>
                            <a href="/paginas/inicio"
                                ><i class="fa-solid fa-house"></i> Página
                                Inicial</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/jogos"
                                ><i class="fa-solid fa-gamepad"></i> Jogos</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/postagens"
                                ><i class="fa-solid fa-book-open"></i>
                                Postagens</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/sobre-nos"
                                ><i class="fa-solid fa-circle-info"></i> Sobre
                                Nós</a
                            >
                        </li>
                    </ul>
                </div>

                <div class="globe hide">
                    <!-- <div class="wrapper"> -->
                    <img
                        class="world"
                        src="/assets/images/world.png"
                        alt="Mundo Bacana"
                    />
                    <img
                        class="seal"
                        src="/assets/images/seal-german-lg.png"
                        alt="Foca de Foca no Trânsito"
                    />
                    <!-- </div> -->
                </div>
            </div>
        </header>
        <div class="header-box"></div>

        <main>
            <section>
                <div class="container page-form">
                    <form>
                        <span class="title">Cadastro</span>
                        <div class="form-section active">
                            <div class="line">
                                <div class="input">
                                    <label>Nome: </label>
                                    <input type="text" name="name" />
                                </div>
                            </div>
                            <div class="line">
                                <div class="input">
                                    <label>Escola: </label>
                                    <input type="text" name="school" />
                                </div>
                                <div class="input">
                                    <label>Etapa Escolar: </label>
                                    <select name="school-level">
                                        <option value="">Nenhum</option>
                                        <option value="f1">
                                            Fundamental 1
                                        </option>
                                        <option value="f2">
                                            Fundamental 2
                                        </option>
                                        <option value="em">Ensino Médio</option>
                                    </select>
                                </div>
                            </div>
                            <div class="line">
                                <div class="input">
                                    <label>Gênero: </label>
                                    <select name="gender">
                                        <option value="m">Masculino</option>
                                        <option value="f">Feminino</option>
                                        <option value="o">Outro</option>
                                    </select>
                                </div>
                                <div class="input">
                                    <label>Data de Nascimento: </label>
                                    <input type="date" name="birthdate" />
                                </div>
                            </div>
                            <div class="input">
                                <label>CEP: </label>
                                <input type="number" placeholder="123456-78" />
                            </div>
                            <div class="line">
                                <div class="input uf">
                                    <label>UF: </label>
                                    <select name="uf">
                                        <option disabled selected></option>
                                        <option value="ac">AC</option>
                                        <option value="al">AL</option>
                                        <option value="ap">AP</option>
                                        <option value="ba">BA</option>
                                        <option value="ce">CE</option>
                                        <option value="df">DF</option>
                                        <option value="es">ES</option>
                                        <option value="go">GO</option>
                                        <option value="ma">MA</option>
                                        <option value="mt">MT</option>
                                        <option value="ms">MS</option>
                                        <option value="mg">MG</option>
                                        <option value="pa">PA</option>
                                        <option value="pb">PB</option>
                                        <option value="pr">PR</option>
                                        <option value="pe">PE</option>
                                        <option value="pi">PI</option>
                                        <option value="rj">RJ</option>
                                        <option value="rn">RN</option>
                                        <option value="rs">RS</option>
                                        <option value="ro">RO</option>
                                        <option value="rr">RR</option>
                                        <option value="sc">SC</option>
                                        <option value="sp">SP</option>
                                        <option value="se">SE</option>
                                        <option value="to">TO</option>
                                    </select>
                                </div>
                                <div class="input">
                                    <label>Cidade: </label>
                                    <input type="text" name="city" />
                                </div>
                                <div class="input">
                                    <label>Bairro: </label>
                                    <input type="text" name="area" />
                                </div>
                            </div>
                        </div>
                        <div class="form-section hidden">
                            <div class="input">
                                <label>E-mail: </label>
                                <input type="email" name="email" />
                            </div>
                            <div class="line password">
                                <div class="input">
                                    <label>Senha: </label>
                                    <input
                                        type="password"
                                        name="password"
                                        minlength="8"
                                        maxlength="31"
                                    />
                                    <button
                                        type="button"
                                        class="turn hide none"
                                    >
                                        <i class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                                <div class="input">
                                    <label>Repetir Senha: </label>
                                    <input
                                        type="password"
                                        name="repeat-password"
                                        minlength="8"
                                        maxlength="31"
                                    />
                                    <button
                                        type="button"
                                        class="turn hide none"
                                    >
                                        <i class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="finish">
                            <a href="/paginas/login">Já possuo uma conta</a>
                            <div class="btns">
                                <button type="button" class="nav prev hidden">
                                    Anterior
                                </button>
                                <button type="button" class="nav next">
                                    Próximo
                                </button>
                                <button type="submit" class="hidden">
                                    Enviar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div class="container">
                <div class="logos">
                    <img
                        src="/assets/images/logos/logo-eptran-white.png"
                        alt="EPTRAN"
                    />
                    <hr />
                    <img
                        src="/assets/images/logos/logo-joinville-white.png"
                        alt="Prefeitura de Joinville"
                    />
                </div>
                <div class="adress">
                    <h3>Informações de Contato</h3>
                    <hr />
                    <ul>
                        <li>
                            R. Caçador, 112 - Atiradores, Joinville - SC,
                            89203-610
                        </li>
                        <li>(47) 99121-0089</li>
                        <li>detrans.uet@joinville.sc.gov.br</li>
                    </ul>
                </div>
                <div class="social-medias">
                    <h3>Redes Sociais</h3>
                    <hr />
                    <ul>
                        <li>
                            <i class="fa-brands fa-youtube"></i>
                            <a href="">YouTube</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-square-facebook"></i>
                            <a href=""> Facebook</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-instagram"></i>
                            <a href="">Instagram</a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>

        <!-- Custom Scripts -->
        <script src="/assets/scripts/sidebar.js"></script>
        <!-- <script src="./cep-search.js"></script> -->
        <script src="./form.js"></script>
    </body>
</html>
