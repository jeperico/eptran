<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EPTRAN</title>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        />

        <!-- Swiper JS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
        />
        <link rel="stylesheet" href="/assets/styles/swiper.css" />

        <!-- Styles -->
        <link rel="stylesheet" href="/assets/styles/main.css" />
        <link rel="stylesheet" href="./form.css">
    </head>

    <body>
        <header>
            <div class="container">
                <button class="nav-btn icon-btn none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <img
                    src="/assets/images/logos/logo-eptran-white.png"
                    alt=""
                    class="logo"
                />
                <a href="/paginas/perfil" class="account-btn icon-btn">
                    <i class="fa-solid fa-circle-user"></i>
                </a>
            </div>

            <div class="modal hide">
                <div class="bg"></div>

                <div class="sidebar hide">
                    <div class="logos">
                        <img
                            src="/assets/images/logos/logo-eptran-white.png"
                            alt="EPTRAN"
                        />
                        <hr />
                        <img
                            src="/assets/images/logos/logo-joinville-white.png"
                            alt="Prefeitura de Joinville"
                        />
                    </div>
                    <hr />
                    <ul>
                        <li>
                            <a href="/paginas/inicio"
                                ><i class="fa-solid fa-house"></i> Página
                                Inicial</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/jogos"
                                ><i class="fa-solid fa-gamepad"></i> Jogos</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/postagens"
                                ><i class="fa-solid fa-book-open"></i>
                                Postagens</a
                            >
                        </li>
                        <li>
                            <a href="/paginas/sobre-nos"
                                ><i class="fa-solid fa-circle-info"></i> Sobre
                                Nós</a
                            >
                        </li>
                    </ul>
                </div>

                <div class="globe hide">
                    <!-- <div class="wrapper"> -->
                    <img
                        class="world"
                        src="/assets/images/world.png"
                        alt="Mundo Bacana"
                    />
                    <img
                        class="seal"
                        src="/assets/images/seal-german-lg.png"
                        alt="Foca de Foca no Trânsito"
                    />
                    <!-- </div> -->
                </div>
            </div>
        </header>
        <div class="header-box"></div>

        <main>

        <div class="box">
            <form id="content">
                <h1>CADASTRO</h1>

                <div class="form-section">
                    <div class="input">
                        <label for="nome">Nome:</label>
                        <input name="nome" type="text" />
                    </div>
                    <div class="input">
                        <label for="nascimento">Data Nascimento:</label>
                        <input name="nascimento" type="date" />
                    </div>
                    <div class="input">
                        <label for="escola">Escola:</label>
                        <input name="escola" type="text" />
                    </div>

                    <div class="input">
                        <label for="etapa-escolar">Etapa escolar:</label>
                        <select id="etapa-escolar" name="etapa-escolar">
                            <option value="F1">Ensino Fundamental 1</option>
                            <option value="F2">Ensino Fundamental 2</option>
                            <option value="EM">Ensino Médio</option>
                        </select>
                    </div>
                    <div class="input">
                        <label for="cep" class="form-label">CEP:</label>
                        <input
                            name="cep"
                            type="text"
                            id="cep"
                            class="form-input"
                            placeholder="00000-000"
                            maxlength="9"
                        />
                    </div>

                    <div class="input">
                        <label for="estado" class="form-label">UF:</label>
                        <select id="estado" name="estado" class="form-select">
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>

                    <div class="input">
                        <label for="cidade" class="form-label">Cidade:</label>
                        <input
                            name="cidade"
                            type="text"
                            id="cidade"
                            class="form-input"
                        />
                    </div>

                    <div class="input">
                        <label for="bairro" class="form-label">Bairro:</label>
                        <input
                            name="bairro"
                            type="text"
                            id="bairro"
                            class="form-input"
                        />
                    </div>
                </div>

                <div class="form-section hidden">
                    <div class="input">
                        <label for="email" class="form-label">Email:</label>
                        <input name="email" type="email" class="form-input" />
                    </div>
                    <div class="input">
                        <label for="password" class="form-label">Senha:</label>
                        <input
                            name="password"
                            type="password"
                            class="form-input"
                        />
                    </div>
                    <div class="input">
                        <label for="repeat-password" class="form-label"
                            >Repetir Senha:</label
                        >
                        <input
                            name="repeat-password"
                            type="password"
                            class="form-input"
                        />
                    </div>
                </div>

                <div class="buttons">
                    <button type="button" id="change-section">Próximo</button>
                    <button type="submit" id="send" class="hidden">
                        Cadastrar
                    </button>
                </div>

                <br />

                <a href="../Login/Login.html" class="form-link"
                    >Já possuo uma conta</a
                >
            </form>
        </div>

        <footer>
            <div class="container">
                <div class="logos">
                    <img
                        src="/assets/images/logos/logo-eptran-white.png"
                        alt="EPTRAN"
                    />
                    <hr />
                    <img
                        src="/assets/images/logos/logo-joinville-white.png"
                        alt="Prefeitura de Joinville"
                    />
                </div>
                <div class="adress">
                    <h3>Informações de Contato</h3>
                    <hr />
                    <ul>
                        <li>
                            R. Caçador, 112 - Atiradores, Joinville - SC,
                            89203-610
                        </li>
                        <li>(47) 99121-0089</li>
                        <li>detrans.uet@joinville.sc.gov.br</li>
                    </ul>
                </div>
                <div class="social-medias">
                    <h3>Redes Sociais</h3>
                    <hr />
                    <ul>
                        <li>
                            <i class="fa-brands fa-youtube"></i>
                            <a href="">YouTube</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-square-facebook"></i>
                            <a href=""> Facebook</a>
                        </li>
                        <li>
                            <i class="fa-brands fa-instagram"></i>
                            <a href="">Instagram</a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>
    
        <script>
            var navBtn = document.querySelector(".nav-btn");
            var navModalBg = document.querySelector("header .modal .bg");
    
            navBtn.addEventListener("click", () => {
                document
                    .querySelector("header .modal")
                    .classList.toggle("hide");
                document.querySelector(".sidebar").classList.toggle("hide");
            });
    
            navModalBg.addEventListener("click", () => {
                document.querySelector(".sidebar").classList.toggle("hide");
                document.querySelector(".modal").classList.toggle("hide");
            });
        </script>
    
        <!-- Swiper JS -->
        <script src="/assets/scripts/swiper.js" type="module"></script>
    </body>
    </html>
